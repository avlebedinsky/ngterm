# The checks of a Dependabot cargo pull request whose Cargo.lock dependabot-lock-edges.yml repaired. That workflow can
# start the pull request's workflows on the repaired commit only by dispatching them, and GitHub neither shows a
# dispatched run's checks on a pull request nor counts them as required checks. So this reports each such run on its
# commit as a commit status named after its workflow, linking the run: pending when the run starts, its result when
# it ends. A status is shown on the pull request, and is what a required check of that name is held to.
#
# Each event of such a run (`in_progress` too: a re-run has no `requested`) posts the same thing, the state the newest
# dispatched run of that workflow on that commit is in when the job reads it, and the jobs of one workflow and commit
# run one at a time. So the status does not depend on the order the events are handled in: a run that ends before
# its `requested` job posts is not left pending, and a superseded run's late end does not replace its successor's
# status.
#
# `workflow_run`: this file and the script are the default branch's, the run's own data comes from the event, and
# nothing of the branch is checked out or run. Only dispatched runs on a `dependabot/cargo/` branch of this repository
# are reported: nobody without write access can dispatch one, and a pull request's own runs report themselves.
#
# `workflows` is the names of the workflows scripts/repair-dependabot-lock.py dispatches (its `WORKFLOWS`); its
# self-test holds the two together.
name: dependabot-lock-checks

on:
  workflow_run:
    workflows: [android, conformance-gate, cross-platform, ios, linux]
    types: [requested, in_progress, completed]
    branches: ["dependabot/cargo/**"]

permissions: {}

# never cancels a running job; a waiting one gives way to a newer one, which posts the same status or a newer one.
# The run's event is in the group: a run of this workflow joins its group before the job's `if` skips it, and one for
# a run that was not dispatched (a reopened pull request's) posts nothing, so it must not replace a waiting job.
concurrency:
  group: >-
    dependabot-lock-checks-${{ github.event.workflow_run.workflow_id }}-${{
    github.event.workflow_run.head_sha }}-${{ github.event.workflow_run.event }}
  cancel-in-progress: false

jobs:
  status:
    if: >-
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/cargo/')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/repair-dependabot-lock.py
          sparse-checkout-cone-mode: false
      - name: report the run on its commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > "$RUNNER_TEMP/run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW_ID/runs?head_sha=$COMMIT&event=workflow_dispatch&per_page=100" \
            > "$RUNNER_TEMP/runs.json"
          scripts/repair-dependabot-lock.py status "$RUNNER_TEMP/run.json" "$RUNNER_TEMP/runs.json" > "$RUNNER_TEMP/status.json"
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$COMMIT" --input "$RUNNER_TEMP/status.json"
